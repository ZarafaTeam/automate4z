name: local.collect
description: |
  This step is used to collect environment variable values based on a specific prefix and key pattern. 
input:
  message:
    type: string
    description: The message to log. It can be a string or a JSON object.
    required: true
output:
  success:
    type: boolean
    description: Indicates whether the logging was successful.
  message:
    type: string
    description: The logged message. If the input is a JSON object, it will be converted to a string before logging.
  